<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask the AI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #1f2937;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f5f3ff);
    }

    main {
      width: min(100%, 720px);
      height: min(760px, calc(100vh - 48px));
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      background: white;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(55, 48, 107, 0.15);
    }

    header {
      padding: 24px;
      color: white;
      background: #6554c0;
    }

    h1 {
      margin: 0 0 6px;
    }

    header p {
      margin: 0;
      opacity: 0.85;
    }

    .setup-status {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 10px;
      color: #392f72;
      font-size: 0.85rem;
      font-weight: bold;
      background: #eeebff;
      border-radius: 999px;
    }

    #chat {
      overflow-y: auto;
      padding: 24px;
      background: #fafafa;
    }

    .message {
      max-width: 80%;
      margin-bottom: 14px;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      color: white;
      background: #6554c0;
      border-bottom-right-radius: 4px;
    }

    .assistant {
      margin-right: auto;
      background: #e9e7f8;
      border-bottom-left-radius: 4px;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 18px;
      border-top: 1px solid #e5e7eb;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font: inherit;
    }

    input:focus {
      border-color: #6554c0;
      outline: 3px solid #e9e7f8;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      color: white;
      font: inherit;
      font-weight: bold;
      background: #6554c0;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    @media (max-width: 520px) {
      body {
        padding: 0;
      }

      main {
        height: 100vh;
        border-radius: 0;
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Ask the AI</h1>
      <p>Ask a question and keep the conversation going.</p>
      <span class="setup-status">API setup pending</span>
    </header>

    <section id="chat" aria-live="polite" aria-label="Chat messages"></section>

    <form id="chat-form">
      <label for="question" hidden>Your question</label>
      <input id="question" type="text" placeholder="Type your question..." autocomplete="off" required>
      <button id="send-button" type="submit">Send</button>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
