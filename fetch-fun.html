<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch Something Fun</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #24313d;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff4d8, #dff5ff);
    }

    main {
      width: min(100%, 600px);
      padding: 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(36, 49, 61, 0.15);
    }

    h1 {
      margin: 0 0 8px;
    }

    .intro {
      margin: 0 0 24px;
      color: #5d6974;
    }

    button {
      padding: 12px 22px;
      border: 0;
      border-radius: 999px;
      color: white;
      font: inherit;
      font-weight: bold;
      background: #6d4aff;
      cursor: pointer;
    }

    button:hover {
      background: #5635dc;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #result {
      min-height: 240px;
      margin-top: 24px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 2px dashed #c9d4dc;
      border-radius: 14px;
      background: white;
    }

    #result img {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: cover;
    }

    #result p {
      margin: 0;
      padding: 32px;
      font-size: 1.25rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>Fetch Something Fun</h1>
    <p class="intro">Get a surprise: a cute dog or a programming joke.</p>

    <button id="surprise-button">Surprise me!</button>
    <div id="result" aria-live="polite">
      <p>Your surprise will appear here.</p>
    </div>
  </main>

  <script>
    const surpriseButton = document.querySelector("#surprise-button");
    const result = document.querySelector("#result");
    let nextSurprise = "dog";

    async function getDog() {
      const response = await fetch("https://dog.ceo/api/breeds/image/random");

      if (!response.ok) {
        throw new Error("Dog API request failed.");
      }

      const data = await response.json();
      const image = document.createElement("img");
      image.src = data.message;
      image.alt = "A random dog";

      result.replaceChildren(image);
    }

    async function getJoke() {
      const response = await fetch(
        "https://v2.jokeapi.dev/joke/Programming?type=single&safe-mode"
      );

      if (!response.ok) {
        throw new Error("Joke API request failed.");
      }

      const data = await response.json();
      const joke = document.createElement("p");
      joke.textContent = `😂 ${data.joke}`;

      result.replaceChildren(joke);
    }

    async function showSurprise() {
      surpriseButton.disabled = true;
      surpriseButton.textContent = "Loading...";
      result.innerHTML = "<p>Finding something fun...</p>";

      try {
        if (nextSurprise === "dog") {
          await getDog();
          nextSurprise = "joke";
        } else {
          await getJoke();
          nextSurprise = "dog";
        }
      } catch (error) {
        result.innerHTML = "<p>Sorry, the surprise could not be loaded. Try again!</p>";
        console.error(error);
      } finally {
        surpriseButton.disabled = false;
        surpriseButton.textContent = "Surprise me!";
      }
    }

    surpriseButton.addEventListener("click", showSurprise);
  </script>
</body>
</html>
