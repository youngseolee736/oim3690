<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorite K-pop Songs</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 24px;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, #111827, #312e81);
    }

    main {
      width: min(100%, 960px);
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(2rem, 6vw, 4rem);
    }

    .intro {
      margin: 0 0 32px;
      color: #c7d2fe;
      font-size: 1.1rem;
    }

    #song-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .song-card {
      padding: 22px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    .song-card h2 {
      margin: 0 0 6px;
      font-size: 1.25rem;
    }

    .artist {
      margin: 0 0 18px;
      color: #fbbf24;
      font-weight: bold;
    }

    .details {
      margin: 6px 0;
      color: #e0e7ff;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>On Repeat</h1>
    <p class="intro" id="intro"></p>
    <section id="song-list" aria-label="Favorite songs"></section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
