<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch Something Fun</title>
</head>
<body>
  <h1>Fetch Something Fun</h1>

  <button id="dog-button">Show me a dog</button>
  <div id="result"></div>

  <script>
    const dogButton = document.querySelector("#dog-button");
    const result = document.querySelector("#result");

    async function getDog() {
      try {
        const response = await fetch("https://dog.ceo/api/breeds/image/random");
        const data = await response.json();

        result.innerHTML = `<img src="${data.message}" alt="A random dog" width="400">`;
      } catch (error) {
        result.textContent = "Sorry, could not load a dog.";
        console.error(error);
      }
    }

    dogButton.addEventListener("click", getDog);
  </script>
</body>
</html>
